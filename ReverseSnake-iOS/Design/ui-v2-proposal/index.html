<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>Snake Feast · UI 重设计提案 v2</title>
<style>
:root{--bg:#FAFAFA;--card:#fff;--ink:#111827;--ink2:#5B6577;--ink3:#9AA3B2;--line:#E7EAF0;--blue:#1D4ED8;
--r:"SF Pro Rounded","SF Compact Rounded",-apple-system,"PingFang SC",sans-serif;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Pro Display","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased;width:1440px}
section{padding:72px 80px;border-bottom:1px solid var(--line)}
.kicker{font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--blue);text-transform:uppercase;margin-bottom:12px}
h1{font-size:56px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
h2{font-size:36px;font-weight:800;letter-spacing:-.015em;margin-bottom:10px}
.lead{font-size:19px;color:var(--ink2);line-height:1.6;max-width:980px}
.row{display:flex;gap:32px;align-items:flex-start}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px}
.cap{font-size:15px;font-weight:700;margin-top:16px;text-align:center}
.sub{font-size:13px;color:var(--ink2);text-align:center;margin-top:4px;line-height:1.5}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:#EEF2FF;color:var(--blue)}
.tag.rec{background:#1D4ED8;color:#fff}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
th{font-size:12px;letter-spacing:.08em;color:var(--ink3);font-weight:700}
/* ---------- phone ---------- */
.phone{width:413px;height:872px;border-radius:64px;background:#1B1C1F;padding:10px;box-shadow:0 30px 60px -20px rgba(15,23,42,.35),0 0 0 1px #2c2d31 inset;flex:none}
.scr{position:relative;width:393px;height:852px;border-radius:54px;overflow:hidden}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;background:#000;border-radius:20px;z-index:20}
.sb{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 44px;font-weight:600;font-size:17px;z-index:19}
.sb i{font-style:normal;font-size:13px;letter-spacing:1px}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;z-index:20}
.num{font-family:var(--r);font-variant-numeric:tabular-nums;font-weight:800}
.topbar{position:absolute;top:56px;left:12px;right:12px;height:60px;display:flex;align-items:center;justify-content:space-between}
.ib{width:42px;height:42px;border-radius:21px;display:flex;align-items:center;justify-content:center}
.stats{position:absolute;top:120px;left:12px;right:12px;height:30px;display:flex;gap:8px}
.chip{flex:1;border-radius:10px;display:flex;align-items:center;gap:7px;padding:0 10px;font-size:12px;white-space:nowrap}
.s3 .pw{width:372px;height:785px}.s3 .pw>div{transform:scale(.9);transform-origin:top left}
.chip b{font-family:var(--r);font-size:14px;font-variant-numeric:tabular-nums;margin-left:auto}
.bar{height:4px;border-radius:2px;width:30px;overflow:hidden}
.bar>span{display:block;height:100%;border-radius:2px}
.boardwrap{position:absolute;left:12px;top:160px;width:369px;border-radius:22px;overflow:hidden}
.btn{height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;gap:8px}
.sheet{position:absolute;left:0;right:0;bottom:0;border-radius:32px 32px 0 0;padding:14px 22px 40px}
.grab{width:38px;height:5px;border-radius:3px;margin:0 auto 18px}
.sw{width:100%;height:84px;border-radius:14px;margin-bottom:10px;position:relative}
.sw span{position:absolute;left:12px;bottom:10px;font-size:12px;font-weight:700}
.swl{font-size:13px;line-height:1.5}
.swl b{display:block;font-size:14px}
.swl code{font-family:ui-monospace,Menlo;color:var(--ink2);font-size:12px}
.ico{border-radius:22.37%;overflow:hidden;flex:none}
.legend-dot{display:inline-block;width:10px;height:10px;border-radius:5px;vertical-align:middle;margin-right:6px}
.cmp td:first-child{font-weight:700;width:150px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:6px 12px;border-radius:99px}
</style></head><body>
<div id="app"></div>
<svg id="measure" width="0" height="0" style="position:absolute"><path id="mp"/></svg>
<script>
/* ================= Themes ================= */
const A={key:'A',name:'夜行 Nocturne',dark:true,bg:'#07090E',surf:'#11151E',surf2:'#1A1F2B',hair:'rgba(255,255,255,.07)',text:'#F3F5F9',text2:'#8C95A8',text3:'#596275',
 board:'#0B0E15',board2:'#0E121B',dot:'rgba(255,255,255,.075)',tail:'#0F2C45',head:'#5CC8FF',headHi:'#9BE0FF',player:'#FF7A2F',playerHi:'#FFC08F',food:'#FFC83D',foodHi:'#FFF0B8',danger:'#FF4D5E',
 primary:'#FF7A2F',onPrimary:'#1A0B02',gold:'#FFC83D',silver:'#C9D3E3',bronze:'#D9935B',iconBg1:'#1A2130',iconBg2:'#06080D'};
const B={key:'B',name:'晨纸 Daylight',dark:false,bg:'#F3EFE6',surf:'#FFFFFF',surf2:'#EAE4D7',hair:'rgba(40,30,10,.08)',text:'#1E1B16',text2:'#7A7264',text3:'#A69E8F',
 board:'#E9E2D3',board2:'#E4DCCB',dot:'rgba(60,45,20,.16)',tail:'#B9D6C3',head:'#1F6B52',headHi:'#3E9474',player:'#FF5A47',playerHi:'#FFB2A8',food:'#E9A410',foodHi:'#FFE3A0',danger:'#E5484D',
 primary:'#1E1B16',onPrimary:'#FFFFFF',gold:'#E9A410',silver:'#B8B2A6',bronze:'#C88A5A',iconBg1:'#F7F3EA',iconBg2:'#E8E0CF'};
const C={key:'C',name:'脉冲 Pulse',dark:true,bg:'#0A0613',surf:'#150E24',surf2:'#1F1533',hair:'rgba(255,255,255,.08)',text:'#F7F2FF',text2:'#A493C4',text3:'#6C5D8A',
 board:'#0E0819',board2:'#120A20',dot:'rgba(255,46,136,.16)',tail:'#3A0D33',head:'#FF2E88',headHi:'#FF8CC0',player:'#C6FF3D',playerHi:'#EFFFB8',food:'#2EE6FF',foodHi:'#C8F8FF',danger:'#FF3B3B',
 primary:'#C6FF3D',onPrimary:'#0A0613',gold:'#FFD23D',silver:'#C9C3E0',bronze:'#E0955B',iconBg1:'#1C1030',iconBg2:'#07040E'};

/* ================= helpers ================= */
const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const lerp=(a,b,t)=>{const x=hx(a),y=hx(b);return 'rgb('+x.map((v,i)=>Math.round(v+(y[i]-v)*t)).join(',')+')'};
const D={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]};
function snakeFrom(start,moves){const c=[[...start]];let [x,y]=start;for(const [d,n] of moves){for(let i=0;i<n;i++){x+=D[d][0];y+=D[d][1];c.push([x,y])}}return c.reverse();}
let uid=0;
function sfx(){return 'g'+(++uid)}

/* ================= Board renderer ================= */
function board(o){
 const T=o.T,cols=o.cols,rows=o.rows,cell=o.cell,W=cols*cell,H=rows*cell,id=sfx();
 const cc=([x,y])=>[(x+.5)*cell,(y+.5)*cell];
 let s='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" style="display:block">';
 s+='<defs><radialGradient id="bg'+id+'" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="'+T.board2+'"/><stop offset="1" stop-color="'+T.board+'"/></radialGradient>'+
  '<radialGradient id="pg'+id+'"><stop offset="0" stop-color="'+T.player+'" stop-opacity=".55"/><stop offset="1" stop-color="'+T.player+'" stop-opacity="0"/></radialGradient>'+
  '<radialGradient id="fg'+id+'"><stop offset="0" stop-color="'+T.food+'" stop-opacity=".5"/><stop offset="1" stop-color="'+T.food+'" stop-opacity="0"/></radialGradient>'+
  '<radialGradient id="vg'+id+'" cx="50%" cy="50%" r="72%"><stop offset=".55" stop-color="'+T.danger+'" stop-opacity="0"/><stop offset="1" stop-color="'+T.danger+'" stop-opacity=".55"/></radialGradient>'+
  '<radialGradient id="hg'+id+'"><stop offset="0" stop-color="'+T.head+'" stop-opacity=".45"/><stop offset="1" stop-color="'+T.head+'" stop-opacity="0"/></radialGradient></defs>';
 s+='<rect width="'+W+'" height="'+H+'" fill="url(#bg'+id+')"/>';
 if(o.grid!==false){for(let x=1;x<cols;x++)for(let y=1;y<rows;y++)s+='<circle cx="'+x*cell+'" cy="'+y*cell+'" r="'+cell*.055+'" fill="'+T.dot+'"/>';}
 // food
 if(o.food){const [fx,fy]=cc(o.food),k=cell*.24;
  s+='<circle cx="'+fx+'" cy="'+fy+'" r="'+cell*.75+'" fill="url(#fg'+id+')"/>';
  s+='<g transform="translate('+fx+','+fy+') rotate(45)"><rect x="'+-k+'" y="'+-k+'" width="'+2*k+'" height="'+2*k+'" rx="'+k*.32+'" fill="'+T.food+'"/>'+
   '<rect x="'+-k*.55+'" y="'+-k*.55+'" width="'+k*.5+'" height="'+k*.5+'" rx="'+k*.14+'" fill="'+T.foodHi+'" opacity=".9"/></g>';
  if(o.eat){s+='<circle cx="'+fx+'" cy="'+fy+'" r="'+cell*.85+'" fill="none" stroke="'+T.food+'" stroke-width="2" opacity=".7"/><circle cx="'+fx+'" cy="'+fy+'" r="'+cell*1.3+'" fill="none" stroke="'+T.food+'" stroke-width="1" opacity=".3"/>';
   for(let i=0;i<8;i++){const a=i*Math.PI/4+.3,r=cell*(1.05+(i%2)*.3);s+='<circle cx="'+(fx+Math.cos(a)*r)+'" cy="'+(fy+Math.sin(a)*r)+'" r="'+cell*.07+'" fill="'+T.food+'"/>'}
   s+='<text x="'+(fx+cell*.6)+'" y="'+(fy-cell*.9)+'" font-family="SF Pro Rounded,-apple-system" font-weight="800" font-size="'+cell*.8+'" fill="'+T.food+'">+1</text>';}
 }
 // snake
 const sn=o.snake;if(sn){const n=sn.length,dead=o.dead;
  const hc=cc(sn[0]);s+='<circle cx="'+hc[0]+'" cy="'+hc[1]+'" r="'+cell*1.1+'" fill="url(#hg'+id+')" opacity="'+(dead?0:1)+'"/>';
  for(let i=n-1;i>=1;i--){const t=1-i/(n-1),a=cc(sn[i]),b=cc(sn[i-1]);
   const col=dead?lerp('#3A1018',T.danger,t*.9):lerp(T.tail,T.head,Math.pow(t,.85));
   s+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="'+col+'" stroke-width="'+cell*(.46+.26*t)+'" stroke-linecap="round"/>';}
  // spine highlight
  for(let i=Math.min(n-1,Math.round(n*.6));i>=1;i--){const t=1-i/(n-1),a=cc(sn[i]),b=cc(sn[i-1]);
   s+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="#fff" stroke-opacity="'+(t*.16)+'" stroke-width="'+cell*.1+'" stroke-linecap="round"/>';}
  const nb=sn[1],dx=sn[0][0]-nb[0],dy=sn[0][1]-nb[1];
  s+='<circle cx="'+hc[0]+'" cy="'+hc[1]+'" r="'+cell*.42+'" fill="'+(dead?T.danger:T.head)+'"/>';
  const ex=-dy,ey=dx;
  for(const sg of[-1,1]){const x=hc[0]+dx*cell*.12+ex*sg*cell*.18,y=hc[1]+dy*cell*.12+ey*sg*cell*.18;
   s+='<circle cx="'+x+'" cy="'+y+'" r="'+cell*.11+'" fill="#fff"/><circle cx="'+(x+dx*cell*.04)+'" cy="'+(y+dy*cell*.04)+'" r="'+cell*.055+'" fill="'+(T.dark?'#07090E':'#1E1B16')+'"/>';}
 }
 // player
 if(o.player){const [px,py]=cc(o.player);
  s+='<circle cx="'+px+'" cy="'+py+'" r="'+cell*.95+'" fill="url(#pg'+id+')"/>';
  const rr=cell*.46;
  if(o.cd!=null){const C2=2*Math.PI*rr;s+='<circle cx="'+px+'" cy="'+py+'" r="'+rr+'" fill="none" stroke="'+T.player+'" stroke-opacity=".22" stroke-width="'+cell*.07+'"/>'+
   '<circle cx="'+px+'" cy="'+py+'" r="'+rr+'" fill="none" stroke="'+T.player+'" stroke-width="'+cell*.07+'" stroke-linecap="round" stroke-dasharray="'+C2*o.cd+' '+C2+'" transform="rotate(-90 '+px+' '+py+')"/>';}
  else s+='<circle cx="'+px+'" cy="'+py+'" r="'+rr+'" fill="none" stroke="'+(o.dead?T.danger:T.player)+'" stroke-opacity=".9" stroke-width="'+cell*.07+'"/>';
  s+='<circle cx="'+px+'" cy="'+py+'" r="'+cell*.29+'" fill="'+(o.dead?T.danger:T.player)+'"/><circle cx="'+(px-cell*.08)+'" cy="'+(py-cell*.08)+'" r="'+cell*.1+'" fill="'+T.playerHi+'"/>';
  if(o.dash){const [ddx,ddy]=D[o.dash];for(let k=1;k<=2;k++){const q=1-k*.33;s+='<circle cx="'+(px-ddx*cell*k)+'" cy="'+(py-ddy*cell*k)+'" r="'+cell*.26*q+'" fill="'+T.player+'" opacity="'+(.45*q)+'"/>'}}
 }
 if(o.threat)s+='<rect width="'+W+'" height="'+H+'" fill="url(#vg'+id+')" opacity="'+o.threat+'"/>';
 return s+'</svg>';
}

/* ================= Icons ================= */
function samplePath(d,n){const p=document.getElementById('mp');p.setAttribute('d',d);const L=p.getTotalLength(),pts=[];for(let i=0;i<=n;i++){const q=p.getPointAtLength(L*i/n);pts.push([q.x,q.y])}return pts}
function rpath(pts,r){let d='M'+pts[0];for(let i=1;i<pts.length-1;i++){const [a,b,c]=[pts[i-1],pts[i],pts[i+1]];
 const u=[Math.sign(b[0]-a[0]),Math.sign(b[1]-a[1])],v=[Math.sign(c[0]-b[0]),Math.sign(c[1]-b[1])];
 d+=' L'+(b[0]-u[0]*r)+','+(b[1]-u[1]*r)+' Q'+b+' '+(b[0]+v[0]*r)+','+(b[1]+v[1]*r);}return d+' L'+pts[pts.length-1];}
function tube(pts,r,w0,w1,c0,c1,n=260,glow){const P=samplePath(rpath(pts,r),n);let s='';
 if(glow)s+='<path d="'+rpath(pts,r)+'" fill="none" stroke="'+c1+'" stroke-opacity=".18" stroke-width="'+(w1*1.6)+'" stroke-linecap="round" stroke-linejoin="round" filter="url(#blur)"/>';
 for(let i=0;i<n;i++){const t=i/n;s+='<line x1="'+P[i][0]+'" y1="'+P[i][1]+'" x2="'+P[i+1][0]+'" y2="'+P[i+1][1]+'" stroke="'+lerp(c0,c1,Math.pow(t,.9))+'" stroke-width="'+(w0+(w1-w0)*t)+'" stroke-linecap="round"/>';}return s}
function orb(T,x,y,r,glow=true){return (glow?'<circle cx="'+x+'" cy="'+y+'" r="'+r*2.4+'" fill="url(#og)"/>':'')+'<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="url(#oc)"/>'}
function icon(T,kind,size,mode){ // mode: undefined | 'dark' | 'tint'
 const id=sfx();let T2=T;
 if(mode==='tint'){T2={...T,iconBg1:'#1B1B1D',iconBg2:'#0A0A0B',tail:'#3A3A3E',head:'#E9E9EE',player:'#BDBDC4',playerHi:'#FFFFFF'}}
 if(mode==='dark'&&!T.dark){T2={...T,iconBg1:'#1E1C18',iconBg2:'#0E0D0B',tail:'#2C4A3E',head:'#58C79B'}}
 if(mode==='dark'&&T.dark){T2={...T,iconBg1:'#0D1118',iconBg2:'#000000'}}
 let s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="'+size+'" height="'+size+'" style="display:block"><defs>'+
 '<linearGradient id="ib" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+T2.iconBg1+'"/><stop offset="1" stop-color="'+T2.iconBg2+'"/></linearGradient>'+
 '<radialGradient id="og"><stop offset="0" stop-color="'+T2.player+'" stop-opacity=".45"/><stop offset="1" stop-color="'+T2.player+'" stop-opacity="0"/></radialGradient>'+
 '<radialGradient id="oc" cx="38%" cy="35%" r="70%"><stop offset="0" stop-color="'+T2.playerHi+'"/><stop offset=".45" stop-color="'+T2.player+'"/><stop offset="1" stop-color="'+T2.player+'"/></radialGradient>'+
 '<filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter></defs>'+
 '<rect width="1024" height="1024" fill="url(#ib)"/>';
 s=s.replace(/id="(ib|og|oc|blur)"/g,'id="$1'+id+'"').replace(/url\(#(ib|og|oc|blur)\)/g,'url(#$1'+id+')');
 let body='';
 if(kind==='I1'){ // Encircle
  body+=tube([[300,800],[800,800],[800,224],[224,224],[224,520],[362,520]],120,58,140,T2.tail,T2.head,340,false);
  body+=orb(T2,585,520,80);
 }else if(kind==='I2'){ // Face-off
  body+=tube([[-80,840],[300,840],[300,540]],170,120,200,T2.tail,T2.head,200,false);
  body+='<rect x="190" y="400" width="250" height="250" rx="110" fill="'+T2.head+'"/>';
  for(const y of[470,580]){body+='<circle cx="380" cy="'+y+'" r="34" fill="#fff"/><circle cx="392" cy="'+y+'" r="17" fill="'+(T.dark?'#07090E':'#1E1B16')+'"/>'}
  body+=orb(T2,730,525,96);
 }else{ // I3 S
  body+=tube([[300,742],[660,742],[660,516],[350,516],[350,290],[566,290]],104,62,124,T2.tail,T2.head,300,false);
  body+=orb(T2,742,290,78);
 }
 body=body.replace(/url\(#(og|oc|blur)\)/g,'url(#$1'+id+')');
 return s+body+'</svg>';
}

/* ================= Phone chrome ================= */
function phone(T,inner,{sbDark}={}){const light=sbDark??!T.dark;const c=light?'#111':'#fff';
 return '<div class="phone"><div class="scr" style="background:'+T.bg+';color:'+T.text+'"><div class="island"></div>'+
 '<div class="sb" style="color:'+c+'"><span>9:41</span><i>●●● ◠ ▬</i></div>'+inner+
 '<div class="homebar" style="background:'+(light?'rgba(0,0,0,.85)':'rgba(255,255,255,.85)')+'"></div></div></div>';}
const svgI={
 pause:c=>'<svg width="16" height="16" viewBox="0 0 16 16"><rect x="3" y="2" width="3.6" height="12" rx="1.4" fill="'+c+'"/><rect x="9.4" y="2" width="3.6" height="12" rx="1.4" fill="'+c+'"/></svg>',
 crown:c=>'<svg width="14" height="14" viewBox="0 0 16 16"><path d="M2 5l3 3 3-5 3 5 3-3-1.4 8H3.4z" fill="'+c+'"/></svg>',
 trophy:c=>'<svg width="18" height="18" viewBox="0 0 20 20"><path d="M5 2h10v4a5 5 0 01-10 0zM5 3H2v2a3 3 0 003 3M15 3h3v2a3 3 0 01-3 3M10 11v4M6 18h8M7.5 15h5" fill="none" stroke="'+c+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
 sound:c=>'<svg width="18" height="18" viewBox="0 0 20 20"><path d="M3 7.5h3l4-3.5v12l-4-3.5H3z" fill="'+c+'"/><path d="M13 7a4 4 0 010 6M15.5 4.5a7.5 7.5 0 010 11" fill="none" stroke="'+c+'" stroke-width="1.7" stroke-linecap="round"/></svg>',
 help:c=>'<svg width="18" height="18" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="'+c+'" stroke-width="1.7"/><path d="M7.6 7.8a2.5 2.5 0 114 2c-.9.6-1.6 1-1.6 2.2" fill="none" stroke="'+c+'" stroke-width="1.7" stroke-linecap="round"/><circle cx="10" cy="14.6" r="1.1" fill="'+c+'"/></svg>',
 play:c=>'<svg width="16" height="16" viewBox="0 0 16 16"><path d="M4 2.5v11l9.5-5.5z" fill="'+c+'"/></svg>',
 restart:c=>'<svg width="18" height="18" viewBox="0 0 20 20"><path d="M4 10a6 6 0 106-6H6.5M8.5 1.5L6 4l2.5 2.5" fill="none" stroke="'+c+'" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>',
 close:c=>'<svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 3l8 8M11 3l-8 8" stroke="'+c+'" stroke-width="2" stroke-linecap="round"/></svg>',
 chev:c=>'<svg width="8" height="12" viewBox="0 0 8 12"><path d="M2 1.5L6.5 6 2 10.5" fill="none" stroke="'+c+'" stroke-width="2" stroke-linecap="round"/></svg>',
 globe:c=>'<svg width="14" height="14" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.3" fill="none" stroke="'+c+'" stroke-width="1.5"/><path d="M1.8 8h12.4M8 1.7c-3 3.4-3 9.2 0 12.6M8 1.7c3 3.4 3 9.2 0 12.6" fill="none" stroke="'+c+'" stroke-width="1.3"/></svg>',
};
function topbar(T,score,best,{paused}={}){
 return '<div class="topbar"><div class="ib" style="background:'+T.surf2+';border:1px solid '+T.hair+'">'+(paused?svgI.play(T.text):svgI.pause(T.text))+'</div>'+
 '<div style="text-align:center"><div style="font-size:11px;font-weight:600;color:'+T.text2+';letter-spacing:.08em">得分</div><div class="num" style="font-size:38px;line-height:1;margin-top:2px">'+score+'</div></div>'+
